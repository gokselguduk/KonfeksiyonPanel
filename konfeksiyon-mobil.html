<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Konfeksiyon Panel">
<meta name="theme-color" content="#0f1117">
<meta name="description" content="Konfeksiyon Panel mobil uygulaması">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./app-icon.png">
<link rel="apple-touch-icon" href="./app-icon.png">
<title>Konfeksiyon Panel · Simteks</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="erp-config.js"></script>
<style>
:root{--bg:#0f1117;--surface:#181c27;--surface2:#1e2436;--surface3:#252c3f;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--text:#e8eaf0;--text2:#9aa3b8;--text3:#5a6280;--accent:#6366f1;--accent2:#818cf8;--green:#10b981;--amber:#f59e0b;--red:#ef4444;--cyan:#06b6d4;--violet:#8b5cf6;--pink:#ec4899}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;width:100%;max-width:100%;margin:0;touch-action:pan-y}
#login-screen{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1.5rem;background:radial-gradient(ellipse at 50% 0%,rgba(99,102,241,.15) 0%,transparent 60%)}
.login-logo{width:64px;height:64px;background:linear-gradient(135deg,var(--accent),var(--violet));border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:1.5rem;box-shadow:0 8px 32px rgba(99,102,241,.3)}
.login-title{font-size:22px;font-weight:700;margin-bottom:4px}
.login-sub{font-size:13px;color:var(--text3);margin-bottom:2rem}
.login-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:1.5rem}
.login-label{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);display:block;margin-bottom:6px;margin-top:14px}
.login-label:first-of-type{margin-top:0}
.login-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;color:var(--text);padding:13px 14px;font-size:15px;outline:none;transition:border-color .2s}
.login-input:focus{border-color:var(--accent)}
.login-input::placeholder{color:var(--text3)}
.login-btn{width:100%;margin-top:1.25rem;background:linear-gradient(135deg,var(--accent),var(--violet));border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:700;padding:14px;cursor:pointer;transition:opacity .2s,transform .1s}
.login-btn:active{transform:scale(.98);opacity:.85}
.login-btn:disabled{opacity:.5;cursor:not-allowed}
.login-err{display:none;margin-top:10px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--red)}
#topbar{display:none;position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;height:54px;align-items:center;gap:10px}
.topbar-logo{width:30px;height:30px;background:linear-gradient(135deg,var(--accent),var(--violet));border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.topbar-title{font-size:14px;font-weight:700;flex:1}
.logout-btn{background:none;border:1px solid var(--border2);border-radius:8px;color:var(--text3);padding:5px 10px;font-size:11px;cursor:pointer}
#app{display:none;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:120;display:flex;background:var(--surface);border-top:1px solid var(--border2);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));gap:8px;box-shadow:0 -8px 28px rgba(0,0,0,.35)}
.bottom-nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 8px;border:1px solid transparent;border-radius:14px;background:transparent;color:var(--text3);cursor:pointer;transition:all .2s;font-family:inherit}
.bottom-nav-btn .bn-ico{font-size:20px;line-height:1}
.bottom-nav-btn .bn-lbl{font-size:10px;font-weight:800;letter-spacing:.3px;text-transform:uppercase}
.bottom-nav-btn.active{background:rgba(99,102,241,.14);border-color:rgba(99,102,241,.35);color:var(--accent2)}
.asama-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.asama-tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px 12px;border-radius:14px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);cursor:pointer;text-align:left;font-family:inherit;transition:transform .12s,border-color .2s,background .2s}
.asama-tile:active{transform:scale(.98)}
.asama-tile.active{border-color:var(--tile-c,var(--accent));background:rgba(99,102,241,.14);box-shadow:inset 0 0 0 1px rgba(99,102,241,.28)}
.asama-tile.active[style*="--tile-c:#8b5cf6"]{background:rgba(139,92,246,.16);box-shadow:inset 0 0 0 1px rgba(139,92,246,.35)}
.asama-tile.active[style*="--tile-c:#06b6d4"]{background:rgba(6,182,212,.14);box-shadow:inset 0 0 0 1px rgba(6,182,212,.35)}
.asama-tile.active[style*="--tile-c:#f59e0b"]{background:rgba(245,158,11,.14);box-shadow:inset 0 0 0 1px rgba(245,158,11,.35)}
.asama-tile.active[style*="--tile-c:#6366f1"]{background:rgba(99,102,241,.16);box-shadow:inset 0 0 0 1px rgba(99,102,241,.35)}
.asama-tile .at-ico{font-size:22px;line-height:1}
.asama-tile .at-lbl{font-size:12px;font-weight:800;letter-spacing:.3px;text-transform:uppercase}
.asama-tile .at-sub{font-size:10px;color:var(--text3);font-weight:600}
.content{padding:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:10px}
.card-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.card-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.card-title{font-size:11px;font-weight:800;letter-spacing:.3px;text-transform:uppercase}
.card-count{font-size:10px;color:var(--text3);margin-left:auto}
.siparis-item{padding:13px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;display:flex;align-items:flex-start;gap:10px}
.siparis-item:last-child{border-bottom:none}
.siparis-item:active{background:var(--surface2)}
.siparis-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:3px}
.siparis-info{flex:1;min-width:0}
.siparis-no{font-size:13px;font-weight:700;margin-bottom:2px}
.siparis-firma{font-size:11px;color:var(--text2);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.siparis-tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:9px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:2px 7px;border-radius:999px}
.tag-green{background:rgba(16,185,129,.12);color:var(--green)}
.tag-amber{background:rgba(245,158,11,.12);color:var(--amber)}
.tag-red{background:rgba(239,68,68,.12);color:var(--red)}
.tag-blue{background:rgba(99,102,241,.12);color:var(--accent2)}
.tag-gray{background:rgba(255,255,255,.06);color:var(--text3)}
.tag-cyan{background:rgba(6,182,212,.12);color:var(--cyan)}
.siparis-right{text-align:right;flex-shrink:0}
.siparis-adet{font-size:17px;font-weight:800}
.siparis-adet-label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px}
#detay-modal{display:none;position:fixed;inset:0;z-index:200}
.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px)}
.modal-sheet{position:absolute;bottom:0;left:0;right:0;background:var(--surface);border-radius:22px 22px 0 0;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;animation:slideUp .3s cubic-bezier(.32,.72,0,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:10px auto 0}
.modal-head{padding:14px 16px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:10}
.modal-sno{font-size:17px;font-weight:800;margin-bottom:3px}
.modal-firma{font-size:12px;color:var(--text2)}
.modal-tabs{display:flex;gap:5px;padding:10px 14px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:76px;z-index:9}
.modal-tabs::-webkit-scrollbar{display:none}
.modal-tab{padding:6px 13px;border-radius:999px;font-size:11px;font-weight:700;background:var(--surface2);border:1px solid var(--border);color:var(--text3);cursor:pointer;white-space:nowrap;transition:all .2s}
.modal-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.modal-body{padding:14px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat-box{background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:11px}
.stat-val{font-size:22px;font-weight:800;line-height:1;margin-bottom:3px}
.stat-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.info-row{display:flex;justify-content:space-between;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border);gap:8px}
.info-row:last-child{border-bottom:none}
.info-key{font-size:11px;color:var(--text3);font-weight:600;flex-shrink:0}
.info-val{font-size:11px;color:var(--text);text-align:right}
.bar-row{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.bar-label{font-size:9px;color:var(--text3);width:44px;flex-shrink:0;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.bar-track{flex:1;height:5px;background:var(--surface3);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .5s}
.bar-val{font-size:10px;font-weight:700;width:28px;text-align:right;flex-shrink:0}
.form-section{background:var(--surface2);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:10px}
.form-section-head{padding:11px 13px;border-bottom:1px solid var(--border);font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.form-section-body{padding:12px 13px}
.field-label{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);display:block;margin-bottom:4px}
.field-input{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:8px;color:var(--text);padding:10px 11px;font-size:14px;outline:none;margin-bottom:10px;transition:border-color .2s;font-family:inherit}
.field-input:focus{border-color:var(--accent)}
.field-input::placeholder{color:var(--text3);font-size:12px}
.field-input:last-child{margin-bottom:0}
.field-select{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:8px;color:var(--text);padding:10px 11px;font-size:13px;outline:none;margin-bottom:10px;-webkit-appearance:none;appearance:none;font-family:inherit}
.field-textarea{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:8px;color:var(--text);padding:10px 11px;font-size:13px;outline:none;margin-bottom:10px;resize:vertical;min-height:64px;font-family:inherit}
.field-textarea:focus{border-color:var(--accent)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field-checkbox{display:flex;align-items:center;gap:8px;margin-bottom:10px;cursor:pointer}
.field-checkbox input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.field-checkbox span{font-size:11px;font-weight:600;color:var(--text2)}
/* Mobil: 16px altı odakta iOS yakınlaştırır; sayı klavyesi daha stabil */
#giris-form-area input.erp-miktar-input{font-size:16px}
.kalem-girdi{background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.kalem-girdi:last-child{margin-bottom:0}
.kalem-girdi-ad{font-size:12px;font-weight:700;margin-bottom:2px}
.kalem-girdi-sub{font-size:10px;color:var(--text3);margin-bottom:8px}
.kalem-girdi-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.kalem-girdi-row:last-child{margin-bottom:0}
.kalem-girdi-lbl{font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;width:64px;flex-shrink:0}
.kalem-girdi-input{flex:1;background:var(--surface2);border:1px solid var(--border2);border-radius:7px;color:var(--text);padding:7px 9px;font-size:13px;outline:none;text-align:center;font-family:inherit}
.kalem-girdi-input:focus{border-color:var(--accent)}
.kalem-girdi-sum{font-size:11px;font-weight:800;width:40px;text-align:right;flex-shrink:0}
.aks-grid{display:grid;grid-template-columns:80px 1fr 1fr 1fr;gap:5px;align-items:center;margin-bottom:6px}
.aks-lbl{font-size:10px;font-weight:700;color:var(--text2)}
.aks-input{background:var(--surface);border:1px solid var(--border2);border-radius:7px;color:var(--text);padding:7px 6px;font-size:13px;outline:none;text-align:center;width:100%;font-family:inherit}
.aks-kalan{font-size:11px;font-weight:800;text-align:center;padding:7px 4px;border-radius:7px}
.save-btn{width:100%;border:none;border-radius:11px;color:#fff;font-size:13px;font-weight:800;padding:13px;cursor:pointer;margin-top:8px;transition:opacity .2s,transform .1s;letter-spacing:.4px}
.save-btn:active{transform:scale(.98);opacity:.85}
.save-btn:disabled{opacity:.4;cursor:not-allowed}
.kpi-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:10px}
.kpi-box{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 8px;text-align:center}
.kpi-val{font-size:21px;font-weight:800}
.kpi-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.sec-title{font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);margin-bottom:7px;margin-top:2px}
.sel-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:10px}
.giris-subtab-bar{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:10px}
.giris-subtab-btn{flex:1;padding:10px 4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--text3);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:all .2s;white-space:nowrap}
.giris-subtab-btn.active{color:var(--accent2);background:var(--surface2);border-bottom-color:var(--accent)}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;gap:10px;color:var(--text3)}
.spinner{width:32px;height:32px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:13px}
.empty .icon{font-size:30px;margin-bottom:8px}
#toast{position:fixed;bottom:calc(88px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);padding:8px 16px;border-radius:8px;font-size:12px;font-weight:700;z-index:9999;display:none;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.3)}
#toast.show{display:block;animation:toastIn .15s ease}
#toast.toast-ok{background:rgba(16,185,129,.15);border:1px solid var(--green);color:var(--green)}
#toast.toast-err{background:rgba(239,68,68,.15);border:1px solid var(--red);color:var(--red)}
#toast.toast-info{background:var(--surface3);border:1px solid var(--border2);color:var(--text2)}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(6px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.filter-row{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filter-row::-webkit-scrollbar{display:none}
.filter-chip{flex-shrink:0;padding:6px 13px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid var(--border2);background:var(--surface2);color:var(--text3);cursor:pointer;transition:all .2s}
.filter-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.log-item{padding:10px 14px;border-bottom:1px solid var(--border)}
.log-item:last-child{border-bottom:none}
.log-islem{font-size:10px;font-weight:800;color:var(--accent2);margin-bottom:2px;text-transform:uppercase;letter-spacing:.4px}
.log-not{font-size:11px;color:var(--text2);margin-bottom:3px}
.log-meta{font-size:10px;color:var(--text3)}
.iki-kal-box{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);border-radius:8px;padding:8px 10px;margin-bottom:6px}

@media (max-width: 480px){
  #topbar{padding:0 10px;height:50px;gap:6px}
  .content{padding:10px}
  .asama-tile{padding:12px 10px}
  .asama-tile .at-lbl{font-size:11px}
  .card-head{padding:10px 11px}
  .siparis-item{padding:10px 11px;gap:8px}
  .siparis-no{font-size:12px}
  .siparis-firma{font-size:10px}
  .siparis-adet{font-size:15px}
  .kpi-row{grid-template-columns:1fr 1fr;gap:6px}
  .kpi-val{font-size:18px}
  .field-row{grid-template-columns:1fr}
  .aks-grid{grid-template-columns:1fr;gap:6px}
  .aks-lbl{font-size:11px}
  .kalem-girdi-row{display:grid;grid-template-columns:56px 1fr 36px;gap:6px;align-items:center}
  .kalem-girdi-lbl{width:auto}
  .modal-sheet{max-height:96dvh}
  .modal-head{padding:10px 12px 8px}
  .modal-tabs{top:64px;padding:8px 10px}
  .modal-body{padding:10px}
  .stat-grid{grid-template-columns:1fr}
  #log-ozet{grid-template-columns:1fr 1fr !important}
  #toast{max-width:92vw;white-space:normal;text-align:center}
}

@media (max-width: 360px){
  .topbar-title{font-size:12px}
  .logout-btn{padding:4px 8px;font-size:10px}
  .tag{font-size:8px;padding:2px 6px}
  #log-ozet{grid-template-columns:1fr !important}
}

/* Tablet optimizasyonu (Samsung Galaxy Tab vb.) */
@media (min-width: 700px){
  body{max-width:none;margin:0}
  #topbar{padding:0 20px}
  .content{padding:18px}
  .bottom-nav{max-width:720px;left:50%;right:auto;transform:translateX(-50%);border-radius:18px 18px 0 0}
  .login-card{max-width:520px}
  .asama-grid{grid-template-columns:1fr 1fr 1fr 1fr}
}
</style>
</head>
<body>

<div id="login-screen">
  <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:2rem">
    <img src="https://simtekstekstil.com.tr/resimler/logo.png" alt="Simteks Logo"
      style="height:60px;max-width:220px;object-fit:contain;margin-bottom:16px;filter:brightness(0) invert(1) drop-shadow(0 4px 16px rgba(99,102,241,0.3))">
    <div style="font-size:12px;font-weight:900;letter-spacing:6px;color:var(--text);text-transform:uppercase;text-align:center;line-height:1.6">
      KONFEKSİYON PANELİ
    </div>
    <div style="width:48px;height:2px;background:linear-gradient(90deg,var(--accent),var(--violet));border-radius:2px;margin-top:10px"></div>
  </div>
  <div class="login-card">
    <label class="login-label">Kullanıcı Adı</label>
    <input id="l-user" class="login-input" type="text" placeholder="kullanici" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('l-pass').focus()">
    <label class="login-label">Şifre</label>
    <input id="l-pass" class="login-input" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" id="login-btn" onclick="doLogin()">Giriş Yap</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<div id="topbar">
  <img src="https://simtekstekstil.com.tr/resimler/logo.png" alt="Simteks"
    style="height:28px;max-width:100px;object-fit:contain;flex-shrink:0;filter:brightness(0) invert(1)">
  <div style="width:1px;height:18px;background:var(--border2);flex-shrink:0"></div>

<script>
let sb=null,currentUser=null,siparisler=[],selectedSiparis=null;
let kdCache={},kdCacheTs={},girisSeciliId=null,girisKd={},girisKalemler=[],girisTab='kesim';
let girisAktifAsama=null;
let girisGirisModu='manuel'; /* manuel | pipeline — varsayılan manuel */
let girisShowSeq=0;
let aktifFilter='HEPSI',siparisAramaTerm='',simteksIds=new Set(),devamdaIds=new Set();
let panelSiparisTum=[]; // durumdan bağımsız: log ve eşleştirme için
let syncBusy=false,syncTimer=null;
const UI_STATE_KEY='konf_ui_state';
function readUiState(){
  try{return JSON.parse(localStorage.getItem(UI_STATE_KEY)||'{}')||{};}catch{return {};}
}
function writeUiState(patch){
  try{
    const next={...readUiState(),...patch,updated_at:Date.now()};
    localStorage.setItem(UI_STATE_KEY,JSON.stringify(next));
  }catch{}
}
function tabToIdx(t){
  return ({siparisler:0,giris:1,rapor:2,log:3})[t] ?? 0;
}
async function restoreUiState(){
  const st=readUiState();
  const tab=['giris','siparisler','rapor','log'].includes(st?.activeTab)?st.activeTab:'siparisler';

  const siparisAramaEl=document.getElementById('siparis-arama');
  if(siparisAramaEl && typeof st?.siparisArama==='string'){
    siparisAramaEl.value=st.siparisArama;
    siparisAramaTerm=st.siparisArama;
  }

  const girisAramaEl=document.getElementById('giris-arama');
  if(girisAramaEl && typeof st?.girisArama==='string')girisAramaEl.value=st.girisArama;
  girisAramaFiltrele();

  if(st?.girisSiparisId){
    const hedefId=String(st.girisSiparisId);
    const sel=document.getElementById('giris-siparis-sel');
    const varMi=siparisler.some(s=>String(s.id)===hedefId);
    if(sel && varMi){
      sel.value=hedefId;
      await girisLoadSiparis();
    }
  }

  const logSearchEl=document.getElementById('log-search');
  if(logSearchEl && typeof st?.logSearch==='string'){
    logSearchEl.value=st.logSearch;
    logSearchTerm=st.logSearch.toLowerCase().trim();
  }

  switchTab(tab,tabToIdx(tab));
}
/* Arka plan prefetch — sadece ilk birkaç sipariş, hafif */
async function prefetchKdData(){
  const liste=(window._girisListesi||[]).slice(0,3);
  for(const s of liste){
    if(kdCache['KD_KONFEKSIYON_'+s.id]===undefined){
      await getKd(s.id,'KD_KONFEKSIYON');
      await new Promise(r=>setTimeout(r,250));
    }
  }
}

function initSB(){const c=window.__ERP_SUPABASE;if(!c||!c.url||!c.anonKey){showErr('erp-config.js yapılandırılmamış.');return false;}sb=supabase.createClient(c.url.trim(),c.anonKey.trim());return true;}
/** onclick / insert için: tam sayı id ise number, aksi halde olduğu gibi (UUID vb.) */
function coerceSiparisIdForDb(id){
  const s=String(id??'').trim();
  if(/^\d+$/.test(s)){const n=parseInt(s,10);return Number.isSafeInteger(n)?n:s;}
  return id;
}

function normText(v){
  return String(v||'')
    .toLowerCase()
    .replaceAll('ı','i')
    .replaceAll('İ','i')
    .replaceAll('ğ','g')
    .replaceAll('ü','u')
    .replaceAll('ş','s')
    .replaceAll('ö','o')
    .replaceAll('ç','c')
    .replace(/[^a-z0-9]+/g,' ')
    .trim();
}
function siparisUretimYeri(s){
  return normText(
    s?.konfeksiyon_yeri ||
    s?.siparis_konfeksiyon_yeri ||
    s?.konfeksiyon_uretim_yeri ||
    s?.uretim_yeri ||
    s?.siparis_uretim_yeri ||
    s?.uretim_yeri_ad ||
    s?.uretim_yeri_adi ||
    s?.uretim_yeri_text ||
    ''
  );
}

/** Ana ERP ile aynı: SIMTEKS_KONF / FASON_KONF / DOGRUDAN_SEVK */
function uaNormalizeUretimYeri(v){
  const s=String(v||'').trim().toUpperCase();
  if(!s) return '';
  if(s==='SIMTEKS'||s==='SIMTEKS_KONF'||s==='SIMTEKS_KONFEKSIYON') return 'SIMTEKS_KONF';
  if(s==='FASON'||s==='FASON_KONF'||s==='FASON_KONFEKSIYON') return 'FASON_KONF';
  if(s==='DOGRUDAN_SEVK'||s==='DOGRUDAN'||s==='DIREKT'||s==='DIREKT_SEVK') return 'DOGRUDAN_SEVK';
  const n=normText(s);
  if(n.includes('fason')) return 'FASON_KONF';
  if((n.includes('dogrudan')||n.includes('direkt')||n.includes('direct'))&&n.includes('sevk')) return 'DOGRUDAN_SEVK';
  if(n.includes('simteks')&&(n.includes('konf')||n.includes('konfeksiyon'))) return 'SIMTEKS_KONF';
  if(n==='simteks') return 'SIMTEKS_KONF';
  return '';
}

/** Ürün ağacı (KD_URUN_AGACI) teknik genel / kalem üretim yeri */
function uaSiparisUretimYeriFromAll(all={},kalemler=[]){
  const siparisFoy=all['siparis_foy']||{};
  const foyYerRaw=String(siparisFoy?.teknik_genel?.uretim_yeri||'').trim();
  if(foyYerRaw) return uaNormalizeUretimYeri(foyYerRaw);
  const sipMeta=all.siparis||{};
  const sipMetaYer=String(
    sipMeta?.urun_teknik_genel?.uretim_yeri||
    sipMeta?.teknik_genel?.uretim_yeri||
    ''
  ).trim();
  if(sipMetaYer) return uaNormalizeUretimYeri(sipMetaYer);
  const sayim={SIMTEKS_KONF:0,FASON_KONF:0,DOGRUDAN_SEVK:0};
  (kalemler||[]).forEach((_,i)=>{
    const ua=all[`u_${i}`]||{};
    const kalemYerRaw=String(
      ua?.urun_teknik_genel?.uretim_yeri||
      ua?.teknik_genel?.uretim_yeri||
      ''
    ).trim();
    if(!kalemYerRaw) return;
    const yer=uaNormalizeUretimYeri(kalemYerRaw);
    if(yer) sayim[yer]=(sayim[yer]||0)+1;
  });
  const dolu=Object.entries(sayim).filter(([,n])=>(parseInt(n,10)||0)>0);
  if(!dolu.length) return '';
  if(dolu.length===1) return dolu[0][0];
  dolu.sort((a,b)=>b[1]-a[1]);
  return dolu[0][0]||'';
}

/** Sipariş kolon + ürün ağacı — boşsa seçilmemiş sayılır (listeye girmez) */
function resolveSiparisUretimYeri(s,kdUa){
  const col=String(s?.uretim_yeri||'').trim();
  if(col){
    const n=uaNormalizeUretimYeri(col);
    if(n) return n;
  }
  const fromUa=uaSiparisUretimYeriFromAll(kdUa||{},parseKalemler(s));
  if(fromUa) return fromUa;
  /* Eski metin alanları (ürün ağacı yoksa yedek) */
  const txt=siparisUretimYeri(s);
  if(txt) return uaNormalizeUretimYeri(txt);
  return '';
}

function isKonfeksiyonDisiSiparis(s,kdUa){
  const yer=resolveSiparisUretimYeri(s,kdUa);
  if(yer==='FASON_KONF'||yer==='DOGRUDAN_SEVK') return true;
  const fasonFlag=String(
    s?.is_fason ?? s?.fason_mu ?? s?.fason_siparis ?? s?.fason_flag ?? ''
  ).toLowerCase();
  const direktSevkFlag=String(
    s?.is_dogrudan_sevk ?? s?.dogrudan_sevk ?? s?.direkt_sevk ?? s?.direct_ship ?? ''
  ).toLowerCase();
  if(['true','1','evet','yes'].includes(fasonFlag)) return true;
  if(['true','1','evet','yes'].includes(direktSevkFlag)) return true;
  return false;
}

/** Yalnızca ürün ağacında Simteks konfeksiyon seçilenler */
function isKonfeksiyonPanelSiparisi(s,kdUa){
  if(isKonfeksiyonDisiSiparis(s,kdUa)) return false;
  return resolveSiparisUretimYeri(s,kdUa)==='SIMTEKS_KONF';
}

/** Toplu ürün ağacı oku (liste filtresi için) */
async function loadUaMapForIds(ids){
  const map={};
  const list=(ids||[]).filter(Boolean);
  for(let i=0;i<list.length;i+=80){
    const chunk=list.slice(i,i+80);
    const{data,error}=await sb.from('siparis_akis')
      .select('siparis_id,kalem_ad,notlar,created_at')
      .eq('islem','KD_URUN_AGACI')
      .in('siparis_id',chunk)
      .order('created_at',{ascending:false});
    if(error) continue;
    (data||[]).forEach(r=>{
      const sid=String(r.siparis_id);
      if(map[sid]!==undefined) return;
      if(r.kalem_ad && String(r.kalem_ad)!=='KD_URUN_AGACI') return;
      let v={};
      try{v=JSON.parse(r.notlar||'{}')||{};}catch{v={};}
      map[sid]=v;
      kdCache['KD_URUN_AGACI_'+sid]=v;
      kdCacheTs['KD_URUN_AGACI_'+sid]=Date.now();
    });
  }
  return map;
}

async function doLogin(){
  const u=document.getElementById('l-user').value.trim();
  const p=document.getElementById('l-pass').value;
  const btn=document.getElementById('login-btn');
  document.getElementById('login-err').style.display='none';
  if(!u||!p){showLoginErr('Kullanıcı adı ve şifre giriniz.');return;}
  if(!sb){showLoginErr('Supabase bağlantısı kurulamadı.');return;}
  btn.disabled=true;btn.textContent='Giriş yapılıyor…';
  try{
    const{data,error}=await sb.rpc('erp_login',{p_username:u,p_password:p});
    if(error)throw error;
    let result=data;
    if(typeof result==='string'){try{result=JSON.parse(result);}catch{}}
    if(!result||result.ok===false){showLoginErr(result?.err||'Kullanıcı adı veya şifre yanlış.');btn.disabled=false;btn.textContent='Giriş Yap';return;}
    const user=result.user||result;
    if(!user||!user.username){showLoginErr('Giriş başarısız.');btn.disabled=false;btn.textContent='Giriş Yap';return;}
    const allowed=normalizeAllowed(user.allowed_modes);
    const isAdmin=String(user.role||'').toLowerCase()==='admin';
    if(!isAdmin&&!allowed.includes('KONFEKSIYON')){showLoginErr('Konfeksiyon yetkisi yok.');btn.disabled=false;btn.textContent='Giriş Yap';return;}
    currentUser={...user,allowed};
    localStorage.setItem('konf_session',JSON.stringify({user:currentUser,ts:Date.now()}));
    startApp();
  }catch(e){showLoginErr('Bağlantı hatası: '+(e.message||e));btn.disabled=false;btn.textContent='Giriş Yap';}
}
function normalizeAllowed(r){if(!r)return[];if(Array.isArray(r))return r;try{const j=JSON.parse(r);return Array.isArray(j)?j:[];}catch{return[];}}
function showLoginErr(m){const el=document.getElementById('login-err');el.textContent=m;el.style.display='block';}
function doLogout(){localStorage.removeItem('konf_session');localStorage.removeItem(UI_STATE_KEY);currentUser=null;siparisler=[];document.getElementById('app').style.display='none';document.getElementById('topbar').style.display='none';document.getElementById('login-screen').style.display='flex';}
function tryRestoreSession(){try{const r=localStorage.getItem('konf_session');if(!r)return false;const s=JSON.parse(r);if(!s.user||!s.ts)return false;if(Date.now()-s.ts>8*60*60*1000){localStorage.removeItem('konf_session');return false;}currentUser=s.user;return true;}catch{return false;}}

async function startApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('topbar').style.display='flex';
  document.getElementById('app').style.display='block';
  document.getElementById('user-info').textContent=currentUser.display_name||currentUser.username;
  await loadSiparisler();
  // UI restore listeyi bloke etmesin
  restoreUiState().catch(()=>{});
  startLiveSync();
  setTimeout(()=>prefetchKdData(),2000);
}

async function loadSiparisler(){
  try{
    const gizli=['TAMAMLANDI','İPTAL','IPTAL'];
    /* Gerçek siparisler kolonları (ana ERP ile aynı) */
    const SIP_COLS='id,created_at,notlar,sno,firma,miktar,kaynak_birim,durum,cins,starih,ttarih,uretim_yeri,siparis_grubu';
    const SIP_COLS_CORE='id,created_at,notlar,sno,firma,miktar,kaynak_birim,durum,cins,starih,ttarih';
    let tumSiparisler=[];
    let sipRes=await sb.from('siparisler')
      .select(SIP_COLS)
      .not('durum','in','("TAMAMLANDI","İPTAL","IPTAL")')
      .order('created_at',{ascending:false})
      .limit(400);
    if(sipRes.error){
      /* uretim_yeri / siparis_grubu yoksa çekirdek kolonlar */
      sipRes=await sb.from('siparisler')
        .select(SIP_COLS_CORE)
        .not('durum','in','("TAMAMLANDI","İPTAL","IPTAL")')
        .order('created_at',{ascending:false})
        .limit(400);
      if(sipRes.error){
        sipRes=await sb.from('siparisler')
          .select(SIP_COLS_CORE)
          .order('created_at',{ascending:false})
          .limit(400);
        if(sipRes.error)throw sipRes.error;
      }
    }
    tumSiparisler=sipRes.data||[];

    /* Kolonda net seçilmiş olanları ayır; belirsizler için ürün ağacı çek */
    const kesin=[];
    const belirsiz=[];
    tumSiparisler.forEach(s=>{
      const col=uaNormalizeUretimYeri(s?.uretim_yeri);
      if(col==='FASON_KONF'||col==='DOGRUDAN_SEVK') return;
      if(col==='SIMTEKS_KONF'){kesin.push(s);return;}
      if(isKonfeksiyonDisiSiparis(s,{})) return;
      belirsiz.push(s);
    });
    const uaMap=await loadUaMapForIds(belirsiz.map(s=>s.id));
    const uaSimteks=belirsiz.filter(s=>isKonfeksiyonPanelSiparisi(s,uaMap[String(s.id)]||{}));

    panelSiparisTum=[...kesin,...uaSimteks];
    /* Tekilleştir */
    const seen=new Set();
    panelSiparisTum=panelSiparisTum.filter(s=>{
      const id=String(s.id);
      if(seen.has(id)) return false;
      seen.add(id);
      return true;
    });
    siparisler=panelSiparisTum.filter(s=>!gizli.includes(String(s.durum||'').toUpperCase().trim()));
    simteksIds=new Set(siparisler.map(s=>String(s.id)));
    window._girisListesi=[...siparisler];
    devamdaIds=new Set();
    const ids=siparisler.map(s=>s.id).filter(Boolean).slice(0,200);
    if(ids.length){
      const akisRes=await sb.from('siparis_akis').select('siparis_id').eq('islem','KD_KONFEKSIYON').in('siparis_id',ids);
      if(!akisRes.error)(akisRes.data||[]).forEach(r=>devamdaIds.add(String(r.siparis_id)));
    }
    renderSiparisler();
    populateSelects();
  }catch(e){document.getElementById('siparis-liste-card').innerHTML=`<div class="empty"><div class="icon">⚠️</div>Yüklenemedi: ${e.message}</div>`;}
}



function siparisAramaBlob(s){
  const k=parseKalemler(s);
  const parca=k.flatMap(x=>[x.ad,x.kod,x.renk,x.ebat,x.olcu,x.cins,x.desen,x.stok_kodu]);
  return normText([
    s.sno,s.firma,s.durum,s.notlar,s.aciklama,s.ttarih,s.starih,
    s.uretim_yeri,s.siparis_grubu,s.miktar,s.kaynak_birim,
    siparisKalemOzeti(s),...parca
  ].join(' '));
}

function siparisAramaFiltrele(){
  const el=document.getElementById('siparis-arama');
  siparisAramaTerm=(el?.value||'').trim();
  writeUiState({siparisArama:siparisAramaTerm});
  renderSiparisler();
}

function kpiFiltrele(f){

  renderSiparisler();

function siparisKalemOzeti(s){

}

/** Kalem / sipariş JSON'dan kısa birim etiketi */
function kalemBirimEtiket(k){
  if(!k||typeof k!=='object')return'adet';
  const raw=String(k.birim||k.birimi||k.olcu_birimi||k.miktar_birimi||k.adet_birimi||k.olcuBirimi||k.unit||k.olcu||'').trim();
  if(!raw)return'adet';
  const n=normText(raw);
  if(n.includes('kilogram'))return'kg';
  if(n==='kg'||n.includes('kg'))return'kg';
  if(n.includes('metre')||n==='mt'||n==='m'||n.includes('meter'))return'm';
  if(n.includes('adet')||n==='adt'||n.includes('piece')||n.includes('pcs'))return'adet';
  if(n.includes('cift'))return'çift';
  if(n.includes('takim'))return'takım';
  if(raw.length<=12)return raw;
  return'adet';
}
/** Tüm kalemler aynı birimdeyse o birim; aksi halde null (satırda göster) */
function kalemlerOrtakBirimEtiket(ks){
  if(!ks||!ks.length)return'adet';
  const u=new Set(ks.map(kalemBirimEtiket));
  return u.size===1?[...u][0]:null;
}
function siparisVeKalemlerOrtakBirim(sip,kalemlerList){
  const fromS=String(sip?.kaynak_birim||sip?.miktar_birimi||sip?.birim||sip?.siparis_birimi||sip?.olcu_birimi||'').trim();
  if(fromS)return kalemBirimEtiket({birim:fromS});
  return kalemlerOrtakBirimEtiket(kalemlerList);
}
function logKayitBirimEtiket(r){

      if(b)return kalemBirimEtiket({birim:b});

  }catch{}

}

function uniq(arr){return [...new Set((arr||[]).filter(Boolean))];}
function isHttpUrl(u){return /^https?:\/\//i.test(String(u||'').trim());}
function isImgSrc(u){
  const s=String(u||'').trim();
  if(!s) return false;
  if(isHttpUrl(s)) return true;
  if(/^data:image\//i.test(s)) return true;
  if(/^blob:/i.test(s)) return true;
  /* ham base64 (jpeg/png) */
  if(/^\/9j\//.test(s)||/^iVBOR/.test(s)) return true;
  /* relative / storage path */
  if(s.startsWith('/')||s.includes('supabase')||s.includes('storage')) return true;
  return s.length>24; /* ana program: boş olmayan src */
}
function normalizeImgSrc(src){
  const s=String(src||'').trim();
  if(!s) return '';
  if(/^\/9j\//.test(s)) return 'data:image/jpeg;base64,'+s;
  if(/^iVBOR/.test(s)) return 'data:image/png;base64,'+s;
  return s;
}
function parseMaybeJson(v){
  if(v==null||v==='') return null;
  if(typeof v==='object') return v;
  try{return JSON.parse(v);}catch{return null;}
}
/** Ana ERP ile aynı normalize */
function siparisFotoNormalizeItem(it){
  if(typeof it==='string'){
    const src=normalizeImgSrc(it.trim());
    return src?{src,aciklama:''}:null;
  }
  if(it&&typeof it==='object'){
    const raw=String(it.src||it.url||it.data||it.resim||it.resim_url||it.image||it.image_url||it.foto||'').trim();
    const src=normalizeImgSrc(raw);
    if(!src) return null;
    return{src,aciklama:String(it.aciklama||it.caption||it.ad||'').trim()};
  }
  return null;
}
function siparisFotograflarFromRaw(raw){
  if(raw==null||raw==='') return [];
  if(Array.isArray(raw)) return raw.map(siparisFotoNormalizeItem).filter(Boolean);
  if(typeof raw==='object'){
    /* {fotolar:[...]} / {images:[...]} sarmalayıcı */
    if(Array.isArray(raw.fotolar)) return siparisFotograflarFromRaw(raw.fotolar);
    if(Array.isArray(raw.images)) return siparisFotograflarFromRaw(raw.images);
    if(Array.isArray(raw.resimler)) return siparisFotograflarFromRaw(raw.resimler);
    const one=siparisFotoNormalizeItem(raw);
    return one?[one]:[];
  }
  const s=String(raw).trim();
  if(!s||s==='[object Object]') return [];
  try{return siparisFotograflarFromRaw(JSON.parse(s));}catch{}
  if(s.startsWith('data:image/')||isHttpUrl(s)||/^\/9j\//.test(s)||/^iVBOR/.test(s)){
    const src=normalizeImgSrc(s);
    return src?[{src,aciklama:''}]:[];
  }
  return [];
}
function siparisKayitFotoAlani(kayit){
  if(!kayit) return null;
  if(kayit.siparis_fotograflar!=null&&kayit.siparis_fotograflar!=='') return kayit.siparis_fotograflar;
  return kayit.fotograf;
}
function collectSiparisResimleri(s){
  const urls=[];
  const push=v=>{
    if(v==null||v==='') return;
    if(typeof v==='string'){
      const n=siparisFotoNormalizeItem(v);
      if(n?.src) urls.push(n.src);
      return;
    }
    if(Array.isArray(v)){v.forEach(push);return;}
    const n=siparisFotoNormalizeItem(v);
    if(n?.src) urls.push(n.src);
  };
  siparisFotograflarFromRaw(siparisKayitFotoAlani(s)).forEach(f=>push(f.src));
  /* yedek: her iki kolon ayrı */
  siparisFotograflarFromRaw(s?.siparis_fotograflar).forEach(f=>push(f.src));
  siparisFotograflarFromRaw(s?.fotograf).forEach(f=>push(f.src));
  [
    s?.resim_url,s?.resim,s?.gorsel,s?.gorsel_url,s?.image,s?.image_url,
    s?.urun_resim,s?.urun_resim_url,s?.model_resim,s?.model_resim_url
  ].forEach(push);
  parseKalemler(s).forEach(k=>{
    push(k?.resim);push(k?.resim_url);push(k?.gorsel);push(k?.gorsel_url);
    push(k?.image);push(k?.image_url);push(k?.foto);push(k?.foto_url);
    push(k?.fotograf);push(k?.fotoSrc);
  });
  [s?.notlar,s?.aciklama,s?.ek_bilgi,s?.detay].forEach(raw=>{
    const j=parseMaybeJson(raw);
    if(!j) return;
    [
      j.resim,j.resim_url,j.gorsel,j.gorsel_url,j.image,j.image_url,j.foto,j.foto_url,j.url,
      ...(Array.isArray(j.resimler)?j.resimler:[]),
      ...(Array.isArray(j.images)?j.images:[]),
      ...(Array.isArray(j.fotograflar)?j.fotograflar:[]),
      ...(Array.isArray(j.fotolar)?j.fotolar:[])
    ].forEach(push);
  });
  return uniq(urls);
}

async function loadSiparisFotograflar(siparisId){
  if(!sb||!siparisId) return {};
  const id=coerceSiparisIdForDb(siparisId);
  const trySelect=async (cols)=>{
    const{data,error}=await sb.from('siparisler').select(cols).eq('id',id).maybeSingle();
    if(error) return {error,data:null};
    return {error:null,data:data||{}};
  };
  try{
    let r=await trySelect('siparis_fotograflar,fotograf');
    if(r.error){
      r=await trySelect('siparis_fotograflar');
      if(r.error) r=await trySelect('fotograf');
    }
    if(r.error||!r.data) return {};
    return r.data;
  }catch{return {};}
}

let girisAramaTimer=null;
function girisAramaTokens(q){
  return String(q||'').trim().toLocaleLowerCase('tr-TR').split(/\s+/).filter(Boolean);
}
function girisAramaSiparisEslesir(s,tokens){
  if(!tokens.length)return true;
  const blob=siparisAramaBlob(s);
  return tokens.every(t=>blob.includes(t));
}
function girisAramaTemizle(){
  const el=document.getElementById('giris-arama');
  if(el)el.value='';

  el?.focus();
}
function girisAramaFiltrele(){
  const sel=document.getElementById('giris-siparis-sel');
  const ozetEl=document.getElementById('giris-arama-ozet');
  const temizleBtn=document.getElementById('giris-arama-temizle');
  const oncekiVal=sel?.value||'';
  const raw=document.getElementById('giris-arama')?.value||'';
  const q=String(raw).trim();
  const tokens=girisAramaTokens(q);
  writeUiState({girisArama:q});
  if(temizleBtn)temizleBtn.style.display=q?'':'none';

  const kaynak=window._girisListesi||siparisler;
  let filtrelendi=tokens.length?kaynak.filter(s=>girisAramaSiparisEslesir(s,tokens)):[...kaynak];
  const opts=filtrelendi.map(s=>{
    const oz=siparisKalemOzeti(s);
    const satir=`${esc(s.sno||'—')} · ${esc(s.firma||'')}`+(oz&&oz!=='—'?` · ${esc(oz)}`:'');
    return `<option value="${s.id}">${satir}</option>`;
  }).join('');
  const pre='<option value="">— Tüm siparişler (filtre yok) —</option>';
  if(sel)sel.innerHTML=pre+opts;
  if(sel&&oncekiVal&&filtrelendi.some(s=>String(s.id)===String(oncekiVal)))sel.value=oncekiVal;

  /* Tek sipariş kaldıysa otomatik kilitle — hızlı seçim */
  if(tokens.length&&filtrelendi.length===1&&sel){
    const onlyId=String(filtrelendi[0].id);
    if(String(sel.value||'')!==onlyId){
      sel.value=onlyId;
      if(String(girisSeciliId||'')!==onlyId){
        clearTimeout(girisAramaTimer);
        girisAramaTimer=setTimeout(()=>girisLoadSiparis(),140);
        if(ozetEl)ozetEl.textContent=`1 sipariş eşleşti → ${filtrelendi[0].sno||onlyId} kilitlendi`;
        return;
      }
    }
  }

  if(ozetEl){
    if(!tokens.length){
      ozetEl.textContent=girisSeciliId
        ?'Sipariş kilitli · arama ile listeyi daraltabilirsiniz'
        :'Arama Kesim / Yıkama / Kalite / Sevk listesini anında daraltır';
    }else{
      const asamaLbl=girisAktifAsama?((UA_ASAMALAR_MAP[girisAktifAsama]||{}).label||girisAktifAsama):null;
      ozetEl.textContent=`${filtrelendi.length} sipariş · “${q}”${asamaLbl?` · ${asamaLbl} listesi filtreleniyor`:''}`;
    }
  }

  clearTimeout(girisAramaTimer);
  girisAramaTimer=setTimeout(()=>{
    if(window.KonfPipeline&&typeof KonfPipeline.setArama==='function'){
      KonfPipeline.setArama(q);
    }
  },120);
}

  const t=normText(a);
  if(!t) return null;
  if(t.includes('kesim')) return 'kesim';
  if(t.includes('yikama')) return 'yikama';
  if(t.includes('kalite') || t==='kk') return 'kalite';
  if(t.includes('sevk')) return 'sevk';
  return null;
}

async function girisManuelSiparisSec(id){
  const sel=document.getElementById('giris-siparis-sel');
  if(sel){
    /* listede yoksa ekle */
    if(![...sel.options].some(o=>String(o.value)===String(id))){
      const s=siparisler.find(x=>String(x.id)===String(id));
      if(s){
        const opt=document.createElement('option');
        opt.value=String(id);
        opt.textContent=`${s.sno||'—'} · ${s.firma||''}`;
        sel.appendChild(opt);
      }
    }
    sel.value=String(id);
  }
  girisGirisModu='manuel';
  await girisLoadSiparis();
  if(girisAktifAsama)girisAsamaIcerikGoster();
}

async function girisAsamaIcerikGoster(){
  const area=document.getElementById('giris-form-area');
  if(!area||!girisAktifAsama)return;
  const seq=++girisShowSeq;

  if(girisGirisModu!=='pipeline'){
    /* ===== MANUEL ===== */
    if(!girisSeciliId){
      area.innerHTML=girisModToggleHtml()
        +`<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px">`
        +girisManuelSiparisHizliSecHtml()
        +`</div>`;
      return;
    }
    area.innerHTML=girisModToggleHtml()+'<div class="loading"><div class="spinner"></div><div style="margin-top:8px;font-size:12px;color:var(--text2)">Manuel form hazırlanıyor…</div></div>';
    try{
      const[kd]=await Promise.all([
        getKd(girisSeciliId,'KD_KONFEKSIYON',false),
        getKd(girisSeciliId,'KD_URUN_AGACI',false)
      ]);
      if(seq!==girisShowSeq)return;
      girisKd={...(kd||{})};
      const sip=siparisler.find(s=>String(s.id)===String(girisSeciliId))
        ||(panelSiparisTum||[]).find(s=>String(s.id)===String(girisSeciliId))
        ||{};
      girisKalemler=parseKalemler(sip);
      /* Kalem yoksa sipariş satırından tek satır üret */
      if(!girisKalemler.length){
        girisKalemler=[{
          ad:siparisKalemOzeti(sip)||sip.sno||'Ürün',
          miktar:parseInt(sip.miktar||0)||0,
          birim:sip.kaynak_birim||sip.birim||'adet',
          renk:'', ebat:''
        }];
      }
      if(seq!==girisShowSeq)return;
      area.innerHTML=girisModToggleHtml()
        +`<div style="font-size:11px;color:var(--text3);margin-bottom:8px;line-height:1.4">
            <b style="color:var(--accent2)">${esc(sip.sno||'')}</b> · ${esc(sip.firma||'')} · Manuel giriş (depo sevki şart değil)
          </div>`
        +renderAsamaIcerik(girisAktifAsama);
    }catch(e){
      if(seq!==girisShowSeq)return;
      area.innerHTML=girisModToggleHtml()+`<div class="empty"><div class="icon">⚠️</div>${esc(e.message||e)}
        <div style="margin-top:10px"><button type="button" class="save-btn" style="width:auto;margin:0;padding:10px 14px" onclick="girisAsamaIcerikGoster()">Tekrar dene</button></div></div>`;
    }
    return;
  }

  /* ===== PIPELINE ===== */
  if(window.KonfPipeline && typeof KonfPipeline.yenile==='function'){
    area.innerHTML=girisModToggleHtml()+'<div class="loading"><div class="spinner"></div><div style="margin-top:8px;font-size:12px;color:var(--text2)">Depo listesi…</div></div>';
    try{
      await KonfPipeline.yenile(false);
      if(seq!==girisShowSeq)return;
      const body=area.innerHTML;
      const hasGirdi=/\bkalem-girdi\b/.test(body);
      area.innerHTML=girisModToggleHtml()+body
        +(!hasGirdi?`<div style="margin-top:10px;padding:12px;border:1px dashed var(--border2);border-radius:12px;background:var(--surface2)">
            <div style="font-size:12px;font-weight:700;margin-bottom:6px">Depoda bekleyen mal yok</div>
            <button type="button" class="save-btn" style="width:auto;margin:0;padding:10px 14px;background:#8b5cf6" onclick="girisModSec('manuel')">✏️ Manuel girişe geç</button>
          </div>`:'');
    }catch(e){
      if(seq!==girisShowSeq)return;
      area.innerHTML=girisModToggleHtml()+`<div class="empty"><div class="icon">⚠️</div>${esc(e.message||e)}
        <div style="margin-top:10px"><button type="button" class="save-btn" style="width:auto;margin:0;padding:10px 14px" onclick="girisModSec('manuel')">✏️ Manuel giriş</button></div></div>`;
    }
  }else{
    area.innerHTML=girisModToggleHtml()+`<div class="empty"><div class="icon">⚠️</div>Pipeline yok — manuel kullanın.
      <div style="margin-top:10px"><button type="button" class="save-btn" style="width:auto;margin:0;padding:10px 14px" onclick="girisModSec('manuel')">✏️ Manuel giriş</button></div></div>`;
  }
}

}

let logDuzenleId=null;
let logTumData=[];
let logAktifFilter='HEPSI';
let logSearchTerm='';
let logGosterilen=40;
const LOG_SAYFA=40;

// İşlem tipine göre ikon ve renk
const LOG_ISLEM_META={
  kesim:   {ikon:'✂️', renk:'#8b5cf6', label:'Kesim'},
  dikim:   {ikon:'🧵', renk:'#ec4899', label:'Dikim'},
  kalite:  {ikon:'🔍', renk:'#f59e0b', label:'Kalite'},
  koli:    {ikon:'📦', renk:'#10b981', label:'Koli'},
  yikama:  {ikon:'💧', renk:'#06b6d4', label:'Yıkama'},
  sevk:    {ikon:'🚚', renk:'#6366f1', label:'Sevk'},
  revize:  {ikon:'🔄', renk:'#f59e0b', label:'Revize'},
  ekleme:  {ikon:'➕', renk:'#10b981', label:'Ekleme'},
  silme:   {ikon:'🗑️', renk:'#ef4444', label:'Silme'},
  duzenleme:{ikon:'✏️',renk:'#818cf8', label:'Düzenleme'},
};

function logIslemMeta(islem){
  const s=String(islem||'').toLowerCase().replace(/İ/g,'i').replace(/ı/g,'i');
  if(s.includes('panel_sil')||s.includes('silme'))return LOG_ISLEM_META.silme;
  if(s.includes('panel_rev')||s.includes('revize'))return LOG_ISLEM_META.revize;
  if(s.includes('kesim'))return LOG_ISLEM_META.kesim;
  if(s.includes('dikim'))return LOG_ISLEM_META.dikim;
  if(s.includes('kalite')||s.includes('kk'))return LOG_ISLEM_META.kalite;
  if(s.includes('koli'))return LOG_ISLEM_META.koli;
  if(s.includes('yikama'))return LOG_ISLEM_META.yikama;
  if(s.includes('sevk'))return LOG_ISLEM_META.sevk;
  if(s.includes('sil')||s.includes('delete'))return LOG_ISLEM_META.silme;
  if(s.includes('guncelle')||s.includes('update')||s.includes('duzenle'))return LOG_ISLEM_META.duzenleme;
  return {ikon:'📝', renk:'var(--accent2)', label:islem||'İşlem'};
}

function logParseNot(r){
  try{
    const p=JSON.parse(r?.notlar||'{}');
    return (p&&typeof p==='object')?p:{};
  }catch{return{};}
}

function logPanelKaydiMi(r){
  const j=logParseNot(r);
  const islem=String(r.islem||'').toUpperCase();
  if(j.konf_panel||j.kaynak==='konfeksiyon_panel')return true;
  if(islem.startsWith('PANEL_')||islem.includes('REVİZE')||islem.includes('REVIZE'))return true;
  return false;
}

function logDenetimMi(r){
  const islem=String(r.islem||'').toUpperCase().replace(/İ/g,'I');
  return islem.startsWith('PANEL_')||islem.includes('REVIZE')||islem.includes('SILME');
}

function logSilindiMi(r){
  const j=logParseNot(r);
  return !!(j.panel_silindi||j.silindi||j.revize_edildi&&j.panel_silindi);
}

function logKullaniciAdi(){
  const u=currentUser;
  return String(u?.display_name||u?.username||'Sistem').trim()||'Sistem';
}

const LOG_PIPELINE_ISLEMLER=new Set(['KESIM','YIKAMA_SEVK','YIKAMA_GELEN','YIKAMA','KK_GECEN','KALITE','KONF_SEVK','SEVK']);

async function logLoadAll(){
  const area=document.getElementById('log-area');
  if(!area)return;
  area.innerHTML='<div class="loading"><div class="spinner"></div><div style="margin-top:8px;font-size:12px;color:var(--text2)">Geçmiş yükleniyor…</div></div>';
  try{
    const sinceIso=new Date(Date.now()-90*24*60*60*1000).toISOString();
    const{data,error}=await sb.from('siparis_akis')
      .select('id,siparis_id,islem,kalem_ad,miktar,notlar,created_at')
      .not('islem','in','("KD_KONFEKSIYON","KD_DOKUMA","KD_URUN_AGACI","KUMAS_GELIS")')
      .gte('created_at',sinceIso)
      .order('created_at',{ascending:false})
      .limit(700);
    if(error)throw error;
    const panelSiparisIdSet=new Set((panelSiparisTum.length?panelSiparisTum:siparisler).map(s=>String(s.id)));
    logTumData=(data||[]).filter(r=>{
      if(!panelSiparisIdSet.has(String(r.siparis_id)))return false;
      const iso=String(r.islem||'').toUpperCase().replace(/İ/g,'I');
      if(LOG_PIPELINE_ISLEMLER.has(iso))return true;
      if(iso.startsWith('PANEL_')||iso.includes('REVIZE')||iso.includes('SILME'))return true;
      return logPanelKaydiMi(r);
    });
    logGosterilen=LOG_SAYFA;
    renderLogFiltreli();
  }catch(e){area.innerHTML=`<div class="empty"><div class="icon">⚠️</div>Hata: ${esc(e.message||e)}</div>`;}
}

function logSetFilter(f,el){
  logAktifFilter=f;
  logGosterilen=LOG_SAYFA;
  document.querySelectorAll('#log-filter-row .filter-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  renderLogFiltreli();
}

function logFiltrele(){
  logSearchTerm=(document.getElementById('log-search')?.value||'').toLowerCase().trim();
  writeUiState({logSearch:logSearchTerm});
  logGosterilen=LOG_SAYFA;
  renderLogFiltreli();
}

function logDahaFazla(){
  logGosterilen+=LOG_SAYFA;
  renderLogFiltreli();
}

function logFiltreUygula(){
  let data=logTumData;
  if(logAktifFilter==='panel'){
    data=data.filter(logPanelKaydiMi);
  }else if(logAktifFilter==='denetim'){
    data=data.filter(logDenetimMi);
  }else if(logAktifFilter!=='HEPSI'){
    if(logAktifFilter==='revize') data=data.filter(r=>String(r.islem||'').toLowerCase().includes('revize'));
    else data=data.filter(r=>String(r.islem||'').toLowerCase().includes(logAktifFilter));
  }
  if(logSearchTerm){
    const q=logSearchTerm;
    data=data.filter(r=>{
      const sip=(panelSiparisTum.length?panelSiparisTum:siparisler).find(s=>String(s.id)===String(r.siparis_id));
      const j=logParseNot(r);
      const user=String(j.user||j.kullanici||j.yapan||j.revize_user||j.silen||'');
      return String(sip?.sno||'').toLowerCase().includes(q)||
             String(sip?.firma||'').toLowerCase().includes(q)||
             String(r.siparis_id||'').includes(q)||
             String(r.islem||'').toLowerCase().includes(q)||
             String(r.kalem_ad||'').toLowerCase().includes(q)||
             user.toLowerCase().includes(q)||
             String(r.notlar||'').toLowerCase().includes(q);
    });
  }
  return data;
}

/** Pipeline ana satırındaki adedi delta kadar düzelt */
async function logPipelineMiktarDuzelt(j,islem,delta,siparisId){
  const gelisId=j?.kumas_gelis_id;
  if(!gelisId||!delta)return;
  const iso=String(islem||'').toUpperCase().replace(/İ/g,'I').replace(/^REVİZE · /,'').replace(/^REVIZE · /,'');
  const{data,error}=await sb.from('siparis_akis').select('id,notlar').eq('id',gelisId).maybeSingle();
  if(error||!data)return;
  let pj={};
  try{pj=JSON.parse(data.notlar||'{}')||{};}catch{pj={};}
  const patch={};
  if(iso==='KESIM'){
    const v=Math.max(0,(parseInt(pj.kesilen_adet||0,10)||0)+delta);
    patch.kesilen_adet=v;
  }else if(iso==='YIKAMA_SEVK'){
    patch.yikama_sevk_adet=Math.max(0,(parseInt(pj.yikama_sevk_adet||0,10)||0)+delta);
  }else if(iso==='YIKAMA_GELEN'||iso==='YIKAMA'){
    patch.yikama_gelen_adet=Math.max(0,(parseInt(pj.yikama_gelen_adet||0,10)||0)+delta);
  }else if(iso==='KK_GECEN'||iso==='KALITE'){
    patch.kalite_gecen_adet=Math.max(0,(parseInt(pj.kalite_gecen_adet||0,10)||0)+delta);
  }else if(iso==='KONF_SEVK'||iso==='SEVK'){
    const v=Math.max(0,(parseInt(pj.sevk_edilen_adet||0,10)||0)+delta);
    patch.sevk_edilen_adet=v;
    patch.kalan_adet=Math.max(0,(parseInt(pj.kalite_gecen_adet||0,10)||0)-v);
  }else return;
  const yeni={...pj,...patch};
  await sb.from('siparis_akis').update({notlar:JSON.stringify(yeni)}).eq('id',gelisId);
  if(window.KonfPipeline&&typeof KonfPipeline.yenile==='function'){
    /* cache invalidate via force */
    try{await KonfPipeline.yenile(true);}catch{}
  }
}

    <div class="kpi-box"><div class="kpi-val" style="color:#06b6d4;font-size:16px">${cnt('yikama')}</div><div class="kpi-lbl">Yıkama</div></div>

  gosterilecek.forEach(r=>{
    const sip=(panelSiparisTum.length?panelSiparisTum:siparisler).find(s=>String(s.id)===String(r.siparis_id));
    const sno=sip?.sno||('#'+r.siparis_id)||'—';
    const firma=sip?.firma||'';
    const meta=logIslemMeta(r.islem);
    const j=logParseNot(r);
    const denetim=logDenetimMi(r);
    const silindi=!!(j.panel_silindi||j.silindi);
    const revizeEdildi=!!j.revize_edildi && !silindi;

    const kullanici=j.user||j.kullanici||j.yapan||j.revize_user||j.silen||'';

    const duzenlenebilir=!denetim&&!silindi;

    if(logDuzenleId!=null&&String(logDuzenleId)===String(r.id)){
      html+=`<div style="background:rgba(99,102,241,.07);border:1px solid var(--accent);border-radius:12px;padding:12px 14px;margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <span style="font-size:11px;font-weight:800;color:var(--accent2)">✏️ Revize</span>
          <button type="button" onclick="logDuzenleIptal()" style="background:none;border:1px solid var(--border2);border-radius:6px;color:var(--text3);font-size:10px;padding:4px 9px;cursor:pointer">✕ İptal</button>
        </div>
        <div style="font-size:10px;color:var(--text3);margin-bottom:8px">${esc(sno)} · ${esc(firma)} · ${meta.ikon} ${esc(r.islem||'')} · ${tarih}</div>
        <label class="field-label">Miktar (${esc(logKayitBirimEtiket(r))})</label>
        <input class="field-input erp-miktar-input" type="text" inputmode="decimal" id="log-rev-miktar" value="${r.miktar||0}" style="margin-bottom:8px;font-size:16px">
        <label class="field-label">Revize notu (zorunlu değil)</label>
        <textarea class="field-textarea" id="log-rev-not" placeholder="Neden düzeltildi?">${esc(j.revize_notu||j.note||'')}</textarea>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px">
          <button type="button" onclick="logRevizeKaydet(${JSON.stringify(String(r.id))})"
            style="background:var(--accent);border:none;border-radius:9px;color:#fff;font-size:12px;font-weight:800;padding:12px;cursor:pointer">💾 Kaydet</button>
          <button type="button" onclick="logSilKaydet(${JSON.stringify(String(r.id))})"
            style="background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);border-radius:9px;color:#ef4444;font-size:12px;font-weight:800;padding:12px;cursor:pointer">🗑️ Sil</button>
        </div>
        <div style="font-size:9px;color:var(--text3);margin-top:8px">Silme kaydı tutulur · kim / ne zaman / eski miktar görünür</div>
      </div>`;

    }

    const bilgiler=[
      sno?`<span style="font-weight:800;color:var(--accent2)">${esc(sno)}</span>`:'',
      firma?`<span style="color:var(--text2)">${esc(firma)}</span>`:'',

    ].filter(Boolean).join('<span style="color:var(--border2);margin:0 3px">·</span>');

    const badge=silindi

      :(revizeEdildi?'<span style="color:var(--amber);font-weight:700">🔄 Revize edildi</span>':'')
        +(logPanelKaydiMi(r)&&!denetim?'<span style="color:var(--accent2);font-weight:600">Panel</span>':'');

    html+=`<div onclick="${duzenlenebilir?`logDuzenleAc(${JSON.stringify(String(r.id))})`:''}" style="background:var(--surface);border:1px solid var(--border);border-left:3px solid ${silindi?'#ef4444':meta.renk};border-radius:10px;padding:9px 12px;margin-bottom:5px;cursor:${duzenlenebilir?'pointer':'default'};${silindi?'opacity:.7':''}">

          ${j.aciklama||j.revize_notu||j.silme_nedeni?`<div style="font-size:10px;color:var(--text3);margin-top:5px">${esc(j.aciklama||j.revize_notu||j.silme_nedeni)}</div>`:''}

        </div>
        ${duzenlenebilir?`<span style="flex-shrink:0;font-size:10px;color:var(--text3);padding:5px 6px">✏️</span>`:''}
      </div>
    </div>`;
  });

  area.innerHTML=html||`<div class="empty"><div class="icon">📭</div>Kayıt yok</div>`;
  if(more)more.style.display=filtered.length>logGosterilen?'block':'none';
}

async function logDenetimEkle(siparisId,aksiyon,payload){
  const user=logKullaniciAdi();
  await sb.from('siparis_akis').insert([{
    siparis_id:coerceSiparisIdForDb(siparisId),
    islem:aksiyon,
    kalem_ad:payload.kalem_ad||aksiyon,

    notlar:JSON.stringify({
      ts:new Date().toISOString(),
      user,
      aksiyon,
      konf_panel:true,
      kaynak:'konfeksiyon_panel',
      ...payload
    })

async function logRevizeKaydet(origId){
  const orig=logTumData.find(r=>String(r.id)===String(origId));
  if(!orig){showToast('❌ Kayıt bulunamadı',2200);return;}
  if(logSilindiMi(orig)||logDenetimMi(orig)){showToast('❌ Bu kayıt düzenlenemez',2200);return;}
  const miktar=erpParseExcelNumberExpr(document.getElementById('log-rev-miktar')?.value||0)||0;
  const not=String(document.getElementById('log-rev-not')?.value||'').trim();
  const j=logParseNot(orig);
  const eskiMiktar=parseFloat(orig.miktar)||0;
  const user=logKullaniciAdi();
  try{
    const yeniJ={
      ...j,
      revize_edildi:true,
      onceki_miktar:eskiMiktar,
      miktar,
      revize_notu:not,
      revize_user:user,
      revize_ts:new Date().toISOString()
    };
    const{error}=await sb.from('siparis_akis').update({
      miktar,
      notlar:JSON.stringify(yeniJ)
    }).eq('id',origId);
    if(error)throw error;

    await logDenetimEkle(orig.siparis_id,'PANEL_REVİZE',{
      hedef_id:origId,
      onceki_islem:orig.islem,
      kalem_ad:orig.kalem_ad||orig.islem,
      eski_miktar:eskiMiktar,
      yeni_miktar:miktar,
      aciklama:not||('Miktar '+eskiMiktar+' → '+miktar),
      kumas_gelis_id:j.kumas_gelis_id||null
    });

    await logPipelineMiktarDuzelt(j,orig.islem,miktar-eskiMiktar,orig.siparis_id);

    logDuzenleId=null;
    showToast('✅ Revize kaydedildi · '+user);
    await logLoadAll();
  }catch(e){showToast('❌ Hata: '+(e.message||e),2200);}
}

async function logSilKaydet(origId){
  const orig=logTumData.find(r=>String(r.id)===String(origId));
  if(!orig){showToast('❌ Kayıt bulunamadı',2200);return;}
  if(logSilindiMi(orig)||logDenetimMi(orig)){showToast('❌ Bu kayıt silinemez',2200);return;}
  const not=String(document.getElementById('log-rev-not')?.value||'').trim();
  if(!confirm('Bu işlem silinsin mi?\n\nKayıt denetim için saklanır; kim sildiği görünür.'))return;
  const j=logParseNot(orig);
  const eskiMiktar=parseFloat(orig.miktar)||0;
  const user=logKullaniciAdi();
  try{
    const yeniJ={
      ...j,
      panel_silindi:true,
      silindi:true,
      onceki_miktar:eskiMiktar,
      silme_nedeni:not,
      silen:user,
      silme_ts:new Date().toISOString()
    };
    const{error}=await sb.from('siparis_akis').update({
      miktar:0,
      notlar:JSON.stringify(yeniJ)
    }).eq('id',origId);
    if(error)throw error;

    await logDenetimEkle(orig.siparis_id,'PANEL_SILME',{
      hedef_id:origId,
      onceki_islem:orig.islem,
      kalem_ad:orig.kalem_ad||orig.islem,
      eski_miktar:eskiMiktar,
      yeni_miktar:0,
      aciklama:not||('Silindi · eski miktar '+eskiMiktar),
      kumas_gelis_id:j.kumas_gelis_id||null
    });

    await logPipelineMiktarDuzelt(j,orig.islem,-eskiMiktar,orig.siparis_id);

    logDuzenleId=null;
    showToast('🗑️ Silindi · kayıt tutuldu · '+user);
    await logLoadAll();
  }catch(e){showToast('❌ Hata: '+(e.message||e),2200);}
}


async function girisKaydet(tip){
  if(!girisSeciliId)return;
  const btn=event.currentTarget;
  const origBtnText=btn?btn.textContent:'💾 KAYDET';

      k.forEach((_,i)=>{if(!kd['kalem_'+i])kd['kalem_'+i]={};

        if(af){kd['kalem_'+i].fire_kesim=(parseInt(kd['kalem_'+i].fire_kesim||0)||0)+af;putDelta(i,'fire_kesim',af);}});

      k.forEach((_,i)=>{if(!kd['kalem_'+i])kd['kalem_'+i]={};

        if(ad){kd['kalem_'+i].dikilen=(parseInt(kd['kalem_'+i].dikilen||0)||0)+ad;putDelta(i,'dikilen',ad);}
        if(af){kd['kalem_'+i].fire_dikim=(parseInt(kd['kalem_'+i].fire_dikim||0)||0)+af;putDelta(i,'fire_dikim',af);}});
    }else if(tip==='kk'){
      kd.kk_tarih=gv('kf-kk-tarih');kd.kk_personel=gv('kf-kk-personel');
      k.forEach((_,i)=>{if(!kd['kalem_'+i])kd['kalem_'+i]={};
        const ak=gi('k-kk_gecen-'+i),at=gi('k-tamir-'+i),ai=gi('k-imha-'+i);
        if(ak){kd['kalem_'+i].kk_gecen=(parseInt(kd['kalem_'+i].kk_gecen||0)||0)+ak;putDelta(i,'kk_gecen',ak);}
        if(at){kd['kalem_'+i].tamir=(parseInt(kd['kalem_'+i].tamir||0)||0)+at;putDelta(i,'tamir',at);}
        if(ai){kd['kalem_'+i].imha=(parseInt(kd['kalem_'+i].imha||0)||0)+ai;putDelta(i,'imha',ai);}});
    }else if(tip==='koli'){
      kd.koli_tarih=gv('kf-koli-tarih');kd.koli_sayi=gv('kf-koli-sayi');
      k.forEach((_,i)=>{if(!kd['kalem_'+i])kd['kalem_'+i]={};
        const ak=gi('k-kolide-'+i);
        if(ak){kd['kalem_'+i].kolide=(parseInt(kd['kalem_'+i].kolide||0)||0)+ak;putDelta(i,'kolide',ak);}});
    }else if(['yikama','nakis','baski','utu','sacak_baglama','sevk'].includes(tip)){
      const tipAlanMap={yikama:'yikama_sevk',nakis:'nakis_adet',baski:'baski_adet',utu:'utu_adet',sacak_baglama:'sacak_baglama_adet',sevk:'sevk_adet'};
      const alan=tipAlanMap[tip];
      k.forEach((_,i)=>{if(!kd['kalem_'+i])kd['kalem_'+i]={};
        const ak=gi('k-'+alan+'-'+i);
        if(ak){
          if(tip==='sevk'){
            const once=kalemAlanDeger(kd['kalem_'+i],'sevk_adet');
            const yeni=once+ak;
            kd['kalem_'+i].sevk_adet=yeni;
            kd['kalem_'+i].sevk_edilen=yeni; /* ana program alanı */
            putDelta(i,'sevk_adet',ak);
            putDelta(i,'sevk_edilen',ak);
          }else if(tip==='yikama'){
            kd['kalem_'+i].yikama_sevk=(parseInt(kd['kalem_'+i].yikama_sevk||0)||0)+ak;
            putDelta(i,'yikama_sevk',ak);
          }else{
            kd['kalem_'+i][alan]=(parseInt(kd['kalem_'+i][alan]||0)||0)+ak;
            putDelta(i,alan,ak);
          }

      });
    }
    kd=syncKdKonfTotals(kd,k);
    kd=await sbKdSet(girisSeciliId,'KD_KONFEKSIYON',kd);
    girisKd={...kd};

    // Ana program iş akışı kodları (rapor / pipeline ile uyumlu)
    const islemAdMap={kesim:'KESIM',dikim:'DIKIM',kk:'KK_GECEN',koli:'KOLI',yikama:'YIKAMA_SEVK',nakis:'NAKIS',baski:'BASKI',utu:'UTU',sacak_baglama:'SACAK_BAGLAMA',sevk:'KONF_SEVK'};
    const islemAdi=islemAdMap[tip]||String(tip||'').toUpperCase();
    const alanMap={kesim:'kesilen',dikim:'dikilen',kk:'kk_gecen',koli:'kolide',yikama:'yikama_sevk',nakis:'nakis_adet',baski:'baski_adet',utu:'utu_adet',sacak_baglama:'sacak_baglama_adet',sevk:'sevk_adet'};
    const logAlan=alanMap[tip];

      const detayAlanEtiket={kesilen:'Kesilen',fire_kesim:'Fire kesim',dikilen:'Dikilen',fire_dikim:'Fire dikim',kk_gecen:'Kalite geçen',tamir:'Tamir',imha:'İmha',kolide:'Kolide',yikama_sevk:'Yıkama sevk',nakis_adet:'Nakış',baski_adet:'Baskı',utu_adet:'Ütü',sacak_baglama_adet:'Saçak bağlama',sevk_adet:'Sevk',sevk_edilen:'Sevk'};
      const detayList=Object.keys(delta).map(a=>`${detayAlanEtiket[a]||a}: +${delta[a]}`);
      if(!logAlan||yapilan>0){
        const notlar=JSON.stringify({
          user:kullaniciAdi,
          kullanici:kullaniciAdi,
          kaynak:'konfeksiyon_panel',
          konf_panel:true,
          manuel_giris:true,
          kalem_idx:i,
          kalem_key:[kalem.ad||kalem.kod||'',kalem.renk||'',kalem.ebat||kalem.olcu||''].join('|'),
          urun_ad:kalem.ad||kalem.kod||'',
          renk:kalem.renk||'',
          ebat:kalem.ebat||kalem.olcu||'',
          siparis_adet:sipAdet,
          birim:kalemBirimEtiket(kalem),
          [logAlan||'miktar']:yapilan,
          detay:detayList,
          ts:new Date().toISOString()
        });
        logPromises.push(sb.from('siparis_akis').insert([{
          siparis_id:coerceSiparisIdForDb(girisSeciliId),
          islem:islemAdi,
          kalem_ad:kalemAdi,
          miktar:yapilan,
          notlar:notlar
        }]));
      }
    });
    if(logPromises.length)await Promise.allSettled(logPromises);
    logTumData=[];

    const kdUa = await getKd(girisSeciliId,'KD_URUN_AGACI');
    /* Manuel kayıt sonrası aynı modda kal */
    if(girisGirisModu!=='pipeline')girisGirisModu='manuel';

}

function kdDataScore(v){
  if(!v||typeof v!=='object') return -1;
  let s=0;
  const tops=['kesim_toplam','dikim_toplam','kk_gecen','koli_toplam','hatali_toplam','panel_yikama_sevk','panel_yikama_gelen','panel_sevk_toplam'];
  tops.forEach(k=>{if(Number(v[k]||0)>0)s+=2;});
  Object.keys(v).forEach(k=>{
    if(!k.startsWith('kalem_')) return;
    const row=v[k]||{};
    if(Number(row.kesilen||0)>0)s+=3;
    if(Number(row.dikilen||0)>0)s+=3;
    if(Number(row.kk_gecen||0)>0)s+=2;
    if(Number(row.kolide||0)>0)s+=2;
    if(Number(row.sevk_edilen||row.sevk_adet||0)>0)s+=2;
    if(Number(row.yikama_sevk||row.yikama_gelen||0)>0)s+=2;
  });
  return s;
}
function kdIsPlainObject(v){return!!v&&typeof v==='object'&&!Array.isArray(v);}
function kdDeepMerge(base,incoming){
  if(!kdIsPlainObject(base)) base={};
  if(!kdIsPlainObject(incoming)) return incoming;
  const out={...base};
  Object.keys(incoming).forEach(k=>{
    const b=base[k],n=incoming[k];
    if(kdIsPlainObject(b)&&kdIsPlainObject(n)) out[k]=kdDeepMerge(b,n);
    else out[k]=n;
  });
  return out;
}

/** Ana program ↔ panel alan eşlemesi (okuma) */
function kalemAlanDeger(kk,alan){
  const row=kk||{};
  if(alan==='yikama_sevk') return parseInt(row.yikama_sevk||row.yikama_gelen||0)||0;
  if(alan==='sevk_adet') return parseInt(row.sevk_adet||row.sevk_edilen||0)||0;
  if(alan==='sevk_edilen') return parseInt(row.sevk_edilen||row.sevk_adet||0)||0;
  return parseInt(row[alan]||0)||0;
}

/** KD toplamlarını ana program alanlarıyla senkron tut */
function syncKdKonfTotals(kd,kalemler){
  const k=kalemler||[];
  let tK=0,tD=0,tKK=0,tKol=0,tH=0,tYik=0,tSev=0;
  k.forEach((_,i)=>{
    if(!kd['kalem_'+i]) kd['kalem_'+i]={};
    const ki=kd['kalem_'+i];
    /* Çift alan yaz: panel + ana ERP */
    if(ki.sevk_adet!=null||ki.sevk_edilen!=null){
      const sev=Math.max(parseInt(ki.sevk_adet||0)||0,parseInt(ki.sevk_edilen||0)||0);
      ki.sevk_adet=sev;
      ki.sevk_edilen=sev;
    }
    if(ki.yikama_sevk!=null){
      ki.yikama_sevk=parseInt(ki.yikama_sevk||0)||0;
    }
    tK+=parseInt(ki.kesilen||0)||0;
    tD+=parseInt(ki.dikilen||0)||0;
    tKK+=parseInt(ki.kk_gecen||0)||0;
    tKol+=parseInt(ki.kolide||0)||0;
    tH+=(parseInt(ki.iki_kalite||0)||0)+(parseInt(ki.tamir||0)||0)+(parseInt(ki.imha||0)||0);
    tYik+=kalemAlanDeger(ki,'yikama_sevk');
    tSev+=kalemAlanDeger(ki,'sevk_adet');
  });
  kd.kesim_toplam=tK;
  kd.dikim_toplam=tD;
  kd.kk_gecen=tKK;
  kd.kalite_toplam=tKK+tH;
  kd.koli_toplam=tKol;
  kd.hatali_toplam=tH;
  kd.panel_yikama_sevk=Math.max(parseInt(kd.panel_yikama_sevk||0)||0,tYik);
  kd.panel_sevk_toplam=Math.max(parseInt(kd.panel_sevk_toplam||0)||0,tSev);
  if(tYik>0) kd.yikama_yapildi=true;
  return kd;
}

async function getKd(id,tip,forceFresh=false){
  const key=tip+'_'+id;
  const now=Date.now();
  const ttlMs=45000; /* panel hızı — 45 sn cache */
  if(!forceFresh && kdCache[key]!==undefined && (now-(kdCacheTs[key]||0))<ttlMs) return kdCache[key];
  try{
    const{data,error}=await sb.from('siparis_akis')
      .select('id,kalem_ad,notlar,created_at')
      .eq('siparis_id',id)
      .eq('islem',tip)
      .order('created_at',{ascending:false})
      .limit(20);
    if(error) throw error;
    const candidates=(data||[])
      .filter(r=>!r?.kalem_ad||String(r.kalem_ad)===String(tip))
      .map(r=>{
        try{
          const parsed=JSON.parse(r?.notlar||'{}')||{};
          return{row:r,parsed,score:kdDataScore(parsed)};
        }catch{return null;}
      })
      .filter(Boolean)
      .sort((a,b)=>{
        const ta=new Date(a.row.created_at||0).getTime();
        const tb=new Date(b.row.created_at||0).getTime();
        if(tb!==ta) return tb-ta;
        const ds=(b.score||0)-(a.score||0);
        if(ds!==0) return ds;
        return String(b.row.id||'').localeCompare(String(a.row.id||''),'tr',{numeric:true,sensitivity:'base'});
      });
    const v=candidates[0]?.parsed||{};
    kdCache[key]=v;
    kdCacheTs[key]=Date.now();
    return v;
  }catch{return{};}
}

async function sbKdSet(id,tip,kd){
  /* Ana programla aynı: önce en güncel ile birleştir, sonra yaz */
  const latest=await getKd(id,tip,true);
  const merged=kdDeepMerge(latest||{},kd||{});
  const json=JSON.stringify(merged);
  const{data:ex,error:selErr}=await sb.from('siparis_akis')
    .select('id')
    .eq('siparis_id',id)
    .eq('islem',tip)
    .eq('kalem_ad',tip)
    .order('created_at',{ascending:false})
    .limit(50);
  if(selErr) throw selErr;
  if(ex&&ex.length>0){
    const{error}=await sb.from('siparis_akis')
      .update({notlar:json,kalem_ad:tip,miktar:0})
      .eq('siparis_id',id)
      .eq('islem',tip)
      .eq('kalem_ad',tip);
    if(error) throw error;
  }else{
    const{error}=await sb.from('siparis_akis').insert([{
      siparis_id:coerceSiparisIdForDb(id),
      islem:tip,
      kalem_ad:tip,
      miktar:0,
      notlar:json
    }]);
    if(error) throw error;
  }
  kdCache[tip+'_'+id]=merged;
  kdCacheTs[tip+'_'+id]=Date.now();
  return merged;
}

async function refreshCurrentView(){
  if(syncBusy||!currentUser||!sb)return;
  syncBusy=true;
  try{
    if(girdiKlavyesiKullanimda())return;
    const tab=aktifTabId();
    if(tab==='siparisler'){
      await loadSiparisler();
    }else if(tab==='giris'){

      await logLoadAll();

  finally{syncBusy=false;}
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
function erpParseExcelNumberExpr(raw){
  const s=String(raw??'').trim();
  if(!s)return 0;
  if(!s.includes('+')){
    const v=parseFloat(s.replaceAll(',','.'));
    return Number.isFinite(v)?Math.trunc(v):0;
  }
  return s.split('+')
    .map(x=>parseFloat(String(x||'').trim().replaceAll(',','.')))
    .filter(Number.isFinite)
    .reduce((a,b)=>a+b,0);
}
function showToast(m,d=1500){
  const t=document.getElementById('toast');
  t.textContent=m;
  t.className='';
  if(m.includes('✅'))t.classList.add('toast-ok');
  else if(m.includes('❌')||m.includes('Hata'))t.classList.add('toast-err');
  else t.classList.add('toast-info');
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>{t.classList.remove('show');},d);
}

function parseKalemler(s){
  try{
    const c=s?.cins ?? s?.kalemler;
    if(!c)return[];
    const p=typeof c==='string'?JSON.parse(c):c;
    return Array.isArray(p)?p:[];

}
function dTag(d){const m={'ÜRETİMDE':'tag-green','DEVAM':'tag-green','BEKLEMEDE':'tag-amber','İPTAL':'tag-red','TAMAMLANDI':'tag-gray'};return`<span class="tag ${m[String(d||'BEKLEMEDE')]||'tag-blue'}">${esc(String(d||'BEKLEMEDE'))}</span>`;}
function dColor(d){const m={'ÜRETİMDE':'#10b981','DEVAM':'#10b981','BEKLEMEDE':'#f59e0b','İPTAL':'#ef4444'};return m[String(d||'')]||'#6366f1';}
function bRow(lbl,val,max,color,birim){
  const pct=max>0?Math.min(100,Math.round(val/max*100)):0;

function compareSno(a,b){return parseSno(a)-parseSno(b);}
function parseSno(s){const x=String(s||'').toUpperCase();const m=x.match(/(\d+)$/);return m?+m[1]:0;}

  }
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){clearTimeout(refreshFocusTimer);refreshFocusTimer=setTimeout(()=>refreshCurrentView(),500);}});
  window.addEventListener('focus',()=>{clearTimeout(refreshFocusTimer);refreshFocusTimer=setTimeout(()=>refreshCurrentView(),450);});
  if(!initSB())return;
  if(tryRestoreSession()){
    startApp();
    startLiveSync();
  }
});
</script>

<script src="./konf-rapor.js"></script>
